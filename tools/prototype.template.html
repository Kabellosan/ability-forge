<title>Ability Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: a working atlas — tabs across the top, the map as a scrolling plate, a reading panel on the right (bottom sheet on phones). */
:root {
  --paper: #eceee7; --panel: #f8f8f4; --ink: #1b2027; --muted: #5d6570; --line: #c7cbc1;
  --accent: #a3301d; --reach: #dfe6da;
  --avail: #1d6b58; --avail-bg: #dcece5; --close: #9a6508; --close-bg: #f3e7cc; --locked: #8a9098;
  --display: "Alegreya SC", "Palatino Linotype", Palatino, Georgia, serif;
  --body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #13161b; --panel: #1b1f26; --ink: #e7e5dc; --muted: #9aa1aa; --line: #2f353e;
  --accent: #e2654c; --reach: #1e2a26;
  --avail: #5cc4a6; --avail-bg: #173229; --close: #e3ab45; --close-bg: #33291a; --locked: #6c737c;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #13161b; --panel: #1b1f26; --ink: #e7e5dc; --muted: #9aa1aa; --line: #2f353e;
  --accent: #e2654c; --reach: #1e2a26;
  --avail: #5cc4a6; --avail-bg: #173229; --close: #e3ab45; --close-bg: #33291a; --locked: #6c737c;
  color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--body); margin: 0; }
.wrap { padding-inline: 16px; padding-block: 14px 24px; max-width: 1500px; margin: 0 auto; display: grid; gap: 12px; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; justify-content: space-between; }
.brand h1 { font: 700 1.9rem/1 var(--display); margin: 0; letter-spacing: .02em; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 11px; cursor: pointer; font-size: .88rem; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
label.pick { display: inline-flex; gap: 6px; align-items: center; font-size: .88rem; color: var(--muted); }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }

nav.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
nav.tabs button { border: 0; background: none; padding: 8px 12px 7px; cursor: pointer; white-space: nowrap;
  font: 500 .98rem var(--display); color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .n { font: 700 .72rem var(--body); background: var(--avail-bg); color: var(--avail); border-radius: 9px; padding: 0 6px; font-variant-numeric: tabular-nums; }
nav.tabs .sep { width: 1px; background: var(--line); margin: 8px 6px; flex: none; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.toolbar input[type=search] { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; width: 200px; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chips .lbl { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 2px 10px; font-size: .84rem; cursor: pointer; }
.chip[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.summary { color: var(--muted); font-size: .9rem; margin-left: auto; font-variant-numeric: tabular-nums; }
.summary b { color: var(--ink); font-weight: 700; }

main.body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.stage { min-width: 0; }
.plate { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); max-height: calc(100vh - 210px); min-height: 320px; }
.plate-inner { position: relative; }
svg.edges { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
svg.edges path { fill: none; stroke: var(--line); stroke-width: 1.6; }
svg.edges path.dash { stroke-dasharray: 5 4; }
svg.edges path.hot { stroke: var(--accent); stroke-width: 2.2; }
svg.edges path.dim { opacity: .25; }

/* nodes */
.node { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel);
  border-radius: 5px; padding: 3px 8px; font-size: .86rem; cursor: pointer; text-align: left; line-height: 1.25; position: relative; z-index: 1; max-width: 100%; }
.node .meta { color: var(--muted); font-size: .74rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.node .src { font: 700 .62rem var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.node.s-owned { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.node.s-owned .meta { color: var(--paper); opacity: .75; }
.node.s-owned .src { color: var(--paper); }
.node.s-available { border-color: var(--avail); background: var(--avail-bg); }
.node.s-close { border: 1px dashed var(--close); background: var(--close-bg); }
.node.s-locked { color: var(--locked); }
.node.sealed { border-style: dotted; color: var(--muted); font-style: italic; }
.node.stub { border-style: dotted; }
.node.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.node.dim { opacity: .28; }
.node.faded { opacity: .35; }

/* climb: both maps read bottom-up, like a skill tree */
.climb { display: flex; flex-direction: column; gap: 38px; padding: 14px 16px 20px; }
.tier { display: grid; gap: 7px; }
.tier > h3 { margin: 0; font: 700 .95rem var(--display); color: var(--muted); display: flex; gap: 10px; align-items: baseline; }
.tier > h3 small { font: 400 .8rem var(--body); }
.tier-row { display: flex; flex-wrap: wrap; gap: 8px 10px; justify-content: center; }
.tier-row > .node { min-width: 150px; justify-content: space-between; }
.cluster { border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px 7px; display: grid; gap: 4px; align-content: start; background: var(--panel); position: relative; z-index: 1; }
.cluster.reached { background: var(--reach); }
.cluster .cl { font-size: .7rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
.cluster .cl b { font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: 0; }
.cluster .in { display: flex; flex-wrap: wrap; gap: 4px; }
.tree-head { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: .9rem; color: var(--muted); }
.tree-head b { color: var(--ink); }
.badge { font-size: .68rem; color: var(--close); border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; white-space: nowrap; }
.s-owned .badge { color: var(--paper); }

/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; padding: 12px; }
.card { display: grid; gap: 4px; align-content: start; padding: 10px 12px; border-radius: 6px; cursor: pointer; text-align: left; }
.card.node { display: grid; }
.card .nm { font: 700 1.02rem var(--display); }
.card .req { font-size: .84rem; }
.card .foot { display: flex; justify-content: space-between; gap: 8px; }

/* detail */
aside.detail { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; position: sticky; top: 12px; max-height: calc(100vh - 40px); overflow: auto; display: grid; gap: 10px; }
aside.detail h2 { font: 700 1.4rem/1.1 var(--display); margin: 0; text-wrap: balance; }
aside.detail .kicker { font: 700 .7rem var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
aside.detail dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: .9rem; }
aside.detail dt { color: var(--muted); }
aside.detail dd { margin: 0; }
aside.detail h4 { margin: 4px 0 2px; font: 700 .74rem var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
aside.detail ul { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 3px; }
.ok { color: var(--avail); font-weight: 700; }
.no { color: var(--accent); font-weight: 700; }
.linky { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; cursor: pointer; }
.prose { font-size: .93rem; max-width: 62ch; }
.gmnote { font-size: .84rem; color: var(--muted); white-space: pre-wrap; border-top: 1px dashed var(--line); padding-top: 8px; }
.verdict { padding: 6px 10px; border-radius: 5px; font-size: .9rem; }
.verdict.s-owned { background: var(--ink); color: var(--paper); }
.verdict.s-available { background: var(--avail-bg); color: var(--avail); }
.verdict.s-close { background: var(--close-bg); color: var(--close); }
.verdict.s-locked { background: var(--paper); color: var(--muted); }
.empty { color: var(--muted); font-size: .92rem; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; font-size: .8rem; }
.close-x { display: none; }

@media (max-width: 900px) {
  main.body { grid-template-columns: minmax(0, 1fr); }
  .plate { max-height: none; }
  aside.detail { position: fixed; left: 0; right: 0; bottom: 0; top: auto; max-height: 62vh; border-radius: 12px 12px 0 0; z-index: 20;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 24px rgb(0 0 0 / .18); }
  .close-x { display: inline-block; justify-self: end; }
  .summary { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) { .node { transition: opacity .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Ability <span>Forge</span></h1>
      <p>View prototype · Core Rulebook, Book of Magic (beta 3), Veritapola homebrew</p>
    </div>
    <div class="controls">
      <label class="pick" for="char">Character
        <select id="char">
          <option value="">Nobody</option>
        </select>
      </label>
      <div class="seg" role="group" aria-label="Viewer">
        <button id="viewer-gm" data-viewer="gm">GM</button><button id="viewer-player" data-viewer="player">Player</button>
      </div>
      <div class="seg" role="group" aria-label="View">
        <button id="view-map" data-view="map">Map</button><button id="view-cards" data-view="cards">Cards</button>
      </div>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search by name" aria-label="Search by name">
    <div class="chips" id="src-chips"></div>
    <div class="chips" id="slot-chips"></div>
    <div class="chips" id="st-chips"></div>
    <div class="summary" id="summary"></div>
  </div>
  <main class="body">
    <div class="stage"><div class="plate" id="plate"><div class="plate-inner" id="inner"></div></div></div>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </main>
</div>

<script type="application/json" id="atlas-data">/*DATA*/</script>
<script>
const D = JSON.parse(document.getElementById('atlas-data').textContent);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- rules data --------------------------------------------------------------
const ATTR = { Acrobatics:'AGL', Awareness:'INT', Bartering:'CHA', 'Beast Lore':'INT', Bluffing:'CHA', Bushcraft:'INT',
  Crafting:'STR', Evade:'AGL', Healing:'INT', 'Hunting & Fishing':'AGL', Languages:'INT', 'Myths & Legends':'INT',
  Performance:'CHA', Persuasion:'CHA', Riding:'AGL', Seamanship:'INT', 'Sleight of Hand':'AGL', Sneaking:'AGL',
  'Spot Hidden':'INT', Swimming:'AGL', Axes:'STR', Bows:'AGL', Brawling:'STR', Crossbows:'AGL', Hammers:'STR',
  Knives:'AGL', Slings:'AGL', Spears:'STR', Staves:'AGL', Swords:'STR' };
const WEAPONS = ['Axes','Bows','Brawling','Crossbows','Hammers','Knives','Slings','Spears','Staves','Swords'];
const MAGIC_SKILLS = ['Animism','Demonology','Elementalism','Illusionism','Mentalism','Necromancy','Symbolism','Witchcraft','Alchemy','Enchanting','Dracomancy'];
const ALIAS = { Swim: 'Swimming' };
const baseChance = a => a <= 5 ? 3 : a <= 8 ? 4 : a <= 12 ? 5 : a <= 15 ? 6 : 7;
const SOURCE_LABEL = { core: 'Core', 'book-of-magic': 'Book of Magic', homebrew: 'Veritapola', svendsen: 'Svendsen pack' };
const SLOT_LABEL = { combat: 'Combat', 'non-combat': 'Non-combat', either: 'Either', undecided: 'Undecided' };
const STATUS_LABEL = { owned: 'Has it', available: 'Can take now', close: 'Within reach', locked: 'Locked' };

// Example characters come from private/characters.json (never committed).
const CHARS = D.characters || {};

const ABIL = Object.fromEntries(D.abilities.map(a => [a.id, a]));
const MAGIC = Object.fromEntries(D.magic.map(m => [m.id, m]));
const SCHOOLS = D.schools;

// ---- evaluation ----------------------------------------------------------------
function sv(ch, skill) {
  skill = ALIAS[skill] || skill;
  if (skill in ch.skills) return ch.skills[skill];
  if (MAGIC_SKILLS.includes(skill)) return 0;
  return ATTR[skill] ? baseChance(ch.attrs[ATTR[skill]]) : 0;
}
function reqLabel(r) {
  if (!r) return '';
  if (r.type === 'none') return 'No requirement';
  if (r.type === 'allOf') return r.of.map(reqLabel).join(' + ');
  if (r.type === 'mastered') return (ABIL[r.ability]?.name || r.ability) + ' mastered';
  if (r.type === 'has') return r.of.map(o => (ABIL[o.ability] || MAGIC[o.spell])?.name || o.ability || o.spell).join(' or ');
  if (r.group) return ({ melee:'Any melee weapon', weapon:'Any weapon skill', 'str-melee':'Any STR melee weapon', magic:'Any magic school' })[r.group] + ' ' + r.level;
  if (r.skills) return r.skills.join(' / ') + ' ' + r.level;
  return r.raw || 'Not printed';
}
function evalReq(r, ch) {
  if (r.type === 'none') return { met: true, gap: 0, rows: [] };
  if (r.type === 'mastered') {
    const ok = ch.abilities.includes(r.ability);
    return { met: ok, gap: ok ? 0 : 99, rows: [{ label: reqLabel(r), ok, id: r.ability }] };
  }
  if (r.type === 'has') {
    const ok = r.of.some(o => o.ability ? ch.abilities.includes(o.ability) : ch.spells.includes(o.spell));
    return { met: ok, gap: ok ? 0 : 99, rows: [{ label: reqLabel(r), ok, links: r.of.map(o => o.ability || o.spell) }] };
  }
  if (r.type === 'allOf') {
    const parts = r.of.map(p => evalReq(p, ch));
    return { met: parts.every(p => p.met), gap: parts.reduce((s, p) => s + p.gap, 0), rows: parts.flatMap(p => p.rows) };
  }
  if (r.skills) {
    let best = r.skills[0], bv = -1;
    for (const s of r.skills) { const v = sv(ch, s); if (v > bv) { bv = v; best = s; } }
    const gap = Math.max(0, r.level - bv);
    return { met: gap === 0, gap, rows: [{ label: reqLabel(r), ok: gap === 0, have: bv, best: r.skills.length > 1 ? best : null }] };
  }
  return { met: false, gap: 99, rows: [{ label: reqLabel(r), ok: false }] };
}
const memo = new Map();
function statusOf(id, ch) {
  if (!ch) return null;
  const key = id;
  if (memo.has(key)) return memo.get(key);
  memo.set(key, 'locked');                       // guards cycles
  let s;
  if (ABIL[id]) {
    const a = ABIL[id];
    if (ch.abilities.includes(id)) s = 'owned';
    else if (a.stub) s = 'locked';
    else {
      const r = evalReq(a.requirement, ch);
      s = r.met ? 'available' : (r.gap <= 2 ? 'close' : 'locked');
      if (a.status === 'earned' && s === 'available') s = 'close';   // cannot be trained, only granted
    }
  } else {
    const m = MAGIC[id];
    if (ch.spells.includes(id)) s = 'owned';
    else if (m.kind === 'trick') s = hasSchool(ch, slug(m.school)) ? 'available' : 'locked';
    else if (prereqMet(m.prerequisite, ch)) s = 'available';
    else {
      const opts = m.prerequisite.anyOf || m.prerequisite.allOf || [];
      const unmet = opts.filter(o => !optMet(o, ch));
      const reachable = o => o.spell && statusOf(o.spell, ch) === 'available';
      const oneStep = unmet.length > 0 && (m.prerequisite.anyOf ? unmet.some(reachable) : unmet.every(reachable));
      s = oneStep ? 'close' : 'locked';
    }
  }
  memo.set(key, s);
  return s;
}
function anySchool(ch) { return MAGIC_SKILLS.some(s => (ch.skills[s] || 0) > 0); }
function hasSchool(ch, sid) {
  if (sid === 'general-magic') return anySchool(ch);
  if (sid === 'harmonism') return sv(ch, 'Performance') >= 12;
  const skill = MAGIC_SKILLS.find(s => slug(s) === sid);
  return (ch.skills[skill] || 0) > 0;
}
function optMet(o, ch) {
  if (o.anySchool) return anySchool(ch);
  if (o.spell) return ch.spells.includes(o.spell);
  if (o.anyRank) return ch.spells.some(id => MAGIC[id] && MAGIC[id].kind !== 'trick' && MAGIC[id].rank === o.anyRank && (!o.school || MAGIC[id].school === o.school));
  if (o.school) return hasSchool(ch, slug(o.school));
  if (o.skill) return sv(ch, o.skill) >= o.level;
  return false;
}
function prereqMet(p, ch) {
  if (p.anyOf) return p.anyOf.some(o => optMet(o, ch));
  if (p.allOf) return p.allOf.every(o => optMet(o, ch));
  return false;
}
function optLabel(o) {
  if (o.anySchool) return 'Any school of magic';
  if (o.spell) return MAGIC[o.spell]?.name || o.spell;
  if (o.anyRank) return `Any rank ${o.anyRank}${o.school ? ' ' + cap(o.school) : ''} spell`;
  if (o.school) return cap(o.school);
  if (o.skill) return `${o.skill} ${o.level}`;
  return o.text || '?';
}
const cap = s => s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());

// ---- state ---------------------------------------------------------------------
const store = { get(k, d) { try { const v = localStorage.getItem('atlas.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem('atlas.' + k, JSON.stringify(v)); } catch {} } };
const S = { tab: store.get('tab', 'abilities'), view: store.get('view', 'map'), char: store.get('char', Object.keys(D.characters || {})[0] || ''),
  viewer: store.get('viewer', 'gm'), q: '', off: new Set(), sel: null };
if (location.hash.length > 1) { const h = location.hash.slice(1); if (h === 'abilities' || SCHOOLS.some(s => s.id === h)) S.tab = h; }
const ch = () => CHARS[S.char] || null;
document.getElementById('char').insertAdjacentHTML('beforeend', Object.entries(CHARS).map(([k, c]) => `<option value="${k}">${esc(c.name)}</option>`).join(''));

// ---- helpers for the current tab ---------------------------------------------
function tabItems(tab) {
  if (tab === 'abilities') return D.abilities;
  const school = SCHOOLS.find(s => s.id === tab).name.toUpperCase();
  return D.magic.filter(m => m.school === school);
}
const sealed = a => S.viewer === 'player' && a.status === 'earned' && !(ch() && ch().abilities.includes(a.id));
function passes(item) {
  if (S.q && !(sealed(item) ? false : item.name.toLowerCase().includes(S.q.toLowerCase()))) return false;
  if (S.off.has('src:' + item.source)) return false;
  if (item.slot && S.off.has('slot:' + item.slot)) return false;
  const st = statusOf(item.id, ch());
  if (st && S.off.has('st:' + st)) return false;
  return true;
}
function nodeHTML(item, extra = '') {
  const st = statusOf(item.id, ch());
  const cls = ['node', st ? 's-' + st : '', sealed(item) ? 'sealed' : '', item.stub ? 'stub' : '', S.sel === item.id ? 'sel' : '', passes(item) ? '' : 'faded'].join(' ');
  if (sealed(item)) return `<button class="${cls}" data-id="${item.id}" title="Earned in play">Sealed · earned in play</button>`;
  const src = item.source === 'homebrew' ? '<span class="src">VP</span>' : item.source === 'svendsen' ? '<span class="src">SV</span>' : '';
  const meta = ABIL[item.id] ? (item.wp && item.wp !== '—' && item.wp !== '–' ? `${esc(item.wp)} WP` : '') : '';
  return `<button class="${cls}" data-id="${item.id}"><span>${esc(item.name)}</span>${src}${meta ? `<span class="meta">${meta}</span>` : ''}${extra}</button>`;
}

// ---- ladder (heroic abilities) ---------------------------------------------
function laneOf(a) {
  let r = a.requirement;
  if (r.type === 'allOf') r = r.of.find(p => p.skills) || r;
  if (a.stub) return { key: 'Not printed', group: 'Open', level: null };
  if (r.type === 'none') return { key: 'No requirement', group: 'Open', level: null };
  const level = r.level ?? null;
  if (r.group) return { key: reqLabel({ ...r, level: '' }).trim(), group: r.group === 'magic' ? 'Magic' : 'Weapons', level, skills: r.skills };
  const key = r.skills.map(s => ALIAS[s] || s).join(' / ');
  const first = ALIAS[r.skills[0]] || r.skills[0];
  const group = WEAPONS.includes(first) ? 'Weapons' : MAGIC_SKILLS.includes(first) ? 'Magic' : ({ STR:'Strength', AGL:'Agility', INT:'Intelligence', CHA:'Charisma' })[ATTR[first]] || 'Other';
  return { key, group, level, skills: r.skills.map(s => ALIAS[s] || s) };
}
function renderLadder() {
  const items = D.abilities.filter(a => !(a.stub && S.viewer === 'player'));
  const GROUPS = ['Open', 'Weapons', 'Strength', 'Agility', 'Intelligence', 'Charisma', 'Magic', 'Other'];
  const levels = [...new Set(items.map(a => laneOf(a).level ?? 0))].sort((x, y) => y - x);   // top = highest
  const c = ch();
  let html = `<div class="tree-head"><span><b>Heroic abilities</b> · ${items.length}, by the skill level they need</span>
    <span class="legend">Read from the bottom up. Arrows: an upgrade opens once the ability below is mastered.</span></div><div class="climb">`;
  for (const lv of levels) {
    const here = items.filter(a => (laneOf(a).level ?? 0) === lv);
    const lanes = new Map();
    for (const a of here) { const l = laneOf(a); if (!lanes.has(l.key)) lanes.set(l.key, { ...l, items: [] }); lanes.get(l.key).items.push(a); }
    const ordered = [...lanes.values()].sort((x, y) => GROUPS.indexOf(x.group) - GROUPS.indexOf(y.group) || x.key.localeCompare(y.key));
    html += `<section class="tier"><h3>${lv ? 'Skill ' + lv : 'No requirement'}<small>${here.length}</small></h3><div class="tier-row">`;
    for (const l of ordered) {
      const have = c && l.skills ? Math.max(...l.skills.map(s => sv(c, s))) : null;
      const reached = have != null && lv && have >= lv;
      html += `<div class="cluster${reached ? ' reached' : ''}"><div class="cl"><span>${esc(l.key)}</span>${have != null ? `<b title="${esc(c.name)}">${have}</b>` : ''}</div>
        <div class="in">${l.items.sort((p, q) => p.name.localeCompare(q.name)).map(a => nodeHTML(a)).join('')}</div></div>`;
    }
    html += '</div></section>';
  }
  return html + '</div>';
}
function ladderEdges() {
  const e = [];
  for (const a of D.abilities) {
    if (a.upgradeOf) e.push({ from: a.upgradeOf, to: a.id });
    for (const ref of reqRefs(a.requirement)) if (ref !== a.upgradeOf && ABIL[ref]) e.push({ from: ref, to: a.id, dash: a.requirement.type === 'has' || a.requirement.of?.some(p => p.type === 'has') });
  }
  return e;
}

// ---- tree (a school) -----------------------------------------------------------
function renderTree(tab) {
  const school = SCHOOLS.find(s => s.id === tab);
  const items = tabItems(tab);
  const ranks = [...new Set(items.map(m => m.rank))].sort((a, b) => a - b);
  const byRank = Object.fromEntries(ranks.map(r => [r, items.filter(m => m.rank === r).sort((a, b) => a.name.localeCompare(b.name))]));
  // order each column by the average position of its prerequisites (fewer crossings)
  const pos = {};
  for (const r of ranks) {
    const col = byRank[r];
    col.forEach((m, i) => { m._bary = i; });
    for (const m of col) {
      const ps = prereqSpells(m).filter(p => pos[p] != null);
      if (ps.length) m._bary = ps.reduce((s, p) => s + pos[p], 0) / ps.length;
      else m._bary = 1000 + col.indexOf(m);
    }
    col.sort((a, b) => a._bary - b._bary || a.name.localeCompare(b.name));
    col.forEach((m, i) => { pos[m.id] = i; });
  }
  const c = ch();
  const kind = items.some(m => m.kind === 'recipe') ? 'Recipes' : items.some(m => m.kind === 'enchantment') ? 'Enchantments' : 'Spells';
  let head = `<div class="tree-head"><span><b>${esc(school.name)}</b> · ${items.filter(m => m.kind !== 'trick').length} ${kind.toLowerCase()}, ${items.filter(m => m.kind === 'trick').length} tricks</span>`;
  if (school.study && school.study.skills) head += `<span>To study: <b>${esc(school.study.skills[0])} ${school.study.level}</b></span>`;
  if (c) {
    const skill = tab === 'harmonism' ? 'Performance' : MAGIC_SKILLS.find(s => slug(s) === tab);
    if (tab === 'general-magic') head += `<span>${esc(c.name)}: ${anySchool(c) ? '<span class="ok">knows a school</span>' : '<span class="no">no school</span>'}</span>`;
    else if (skill) head += `<span>${esc(c.name)}: <b>${esc(skill)} ${sv(c, skill) || '—'}</b></span>`;
  }
  head += `<span class="legend">Read from the bottom up. Solid line: needs it · dashed: one of several</span></div>`;
  const tiers = [...ranks].reverse().map(r => `<section class="tier"><h3>${r === 0 ? 'Magic tricks' : 'Rank ' + r}<small>${byRank[r].length}</small></h3>
    <div class="tier-row">${byRank[r].map(m => nodeHTML(m, badges(m))).join('')}</div></section>`).join('');
  return head + `<div class="climb">${tiers}</div>`;
}
function prereqSpells(m) {
  const p = m.prerequisite || {};
  return (p.anyOf || p.allOf || []).filter(o => o.spell).map(o => o.spell);
}
function badges(m) {
  const p = m.prerequisite || {};
  const opts = p.anyOf || p.allOf || [];
  const out = [];
  for (const o of opts) {
    if (o.anyRank) out.push(`any R${o.anyRank}${o.school ? ' ' + cap(o.school).slice(0, 5) + '.' : ''}`);
    if (o.skill) out.push(`${o.skill} ${o.level}`);
    if (o.spell && MAGIC[o.spell] && MAGIC[o.spell].school !== m.school) out.push(`via ${MAGIC[o.spell].name}`);
  }
  return out.map(b => `<span class="badge">${esc(b)}</span>`).join('');
}
function treeEdges(tab) {
  const e = [];
  for (const m of tabItems(tab)) {
    const p = m.prerequisite || {};
    const ps = prereqSpells(m);
    for (const s of ps) e.push({ from: s, to: m.id, dash: !!p.anyOf && (p.anyOf.length > 1) });
  }
  return e;
}

// ---- cards ---------------------------------------------------------------------
function renderCards(tab) {
  const order = { owned: 0, available: 1, close: 2, locked: 3 };
  const items = tabItems(tab).filter(passes).filter(a => !(a.stub && S.viewer === 'player'))
    .sort((a, b) => ((order[statusOf(a.id, ch())] ?? 0) - (order[statusOf(b.id, ch())] ?? 0)) || (a.rank ?? 0) - (b.rank ?? 0) || a.name.localeCompare(b.name));
  if (!items.length) return `<p class="empty" style="padding:16px">Nothing matches these filters.</p>`;
  return `<div class="cards">${items.map(it => {
    const st = statusOf(it.id, ch());
    const cls = `card node ${st ? 's-' + st : ''} ${S.sel === it.id ? 'sel' : ''} ${sealed(it) ? 'sealed' : ''}`;
    if (sealed(it)) return `<button class="${cls}" data-id="${it.id}"><span class="nm">Sealed</span><span class="req">Earned in play. The GM grants it when the story earns it.</span></button>`;
    const req = ABIL[it.id] ? reqLabel(it.requirement) : it.kind === 'trick' ? 'Magic trick · 1 WP' : (it.prerequisite?.raw ? 'Needs ' + (it.prerequisite.anyOf || it.prerequisite.allOf).map(optLabel).join(it.prerequisite.allOf ? ' and ' : ' or ') : '');
    const right = ABIL[it.id] ? (it.wp ? `${esc(it.wp)} WP` : '') : it.rank ? `Rank ${it.rank}` : '';
    return `<button class="${cls}" data-id="${it.id}"><span class="nm">${esc(it.name)}</span><span class="req">${esc(req)}</span>
      <span class="foot"><span class="meta">${esc(SOURCE_LABEL[it.source] || it.source)}${it.slot ? ' · ' + SLOT_LABEL[it.slot] : ''}</span><span class="meta">${right}</span></span></button>`;
  }).join('')}</div>`;
}

// ---- detail panel --------------------------------------------------------------
function reqRefs(r) {                       // abilities/spells a requirement names
  if (!r) return [];
  if (r.type === 'allOf') return r.of.flatMap(reqRefs);
  if (r.type === 'mastered') return [r.ability];
  if (r.type === 'has') return r.of.map(o => o.ability || o.spell);
  return [];
}
function unlocksOf(id) {
  const out = [];
  for (const a of D.abilities) {
    if (a.upgradeOf === id || reqRefs(a.requirement).includes(id)) out.push(a.id);
  }
  for (const m of D.magic) if (prereqSpells(m).includes(id)) out.push(m.id);
  return [...new Set(out)];
}
function link(id) {
  const it = ABIL[id] || MAGIC[id];
  if (!it) return esc(id);
  const st = statusOf(id, ch());
  return `<button class="linky" data-id="${id}" data-jump="1">${esc(it.name)}</button>${st ? ` <span class="meta">· ${STATUS_LABEL[st].toLowerCase()}</span>` : ''}`;
}
function renderDetail() {
  const el = document.getElementById('detail');
  const it = S.sel && (ABIL[S.sel] || MAGIC[S.sel]);
  if (!it) {
    el.innerHTML = `<div class="kicker">How to read this</div>
      <p class="prose">Pick an ability or spell to see what it needs and what it opens. Choose a character to colour the map by what they can reach.</p>
      <div class="legend"><span class="node s-owned">Has it</span><span class="node s-available">Can take now</span><span class="node s-close">Within reach</span><span class="node s-locked">Locked</span></div>
      <p class="empty">Both maps read from the bottom up. Heroic abilities climb by the skill level they need; a shaded skill box means the character already has that level. Schools climb from magic tricks through the ranks, with lines up to the spells each one opens.</p>`;
    el.hidden = window.matchMedia('(max-width: 900px)').matches;
    return;
  }
  el.hidden = false;
  const c = ch();
  const st = statusOf(it.id, c);
  if (sealed(it)) {
    el.innerHTML = `<button class="linky close-x" data-close="1">Close</button><div class="kicker">Heroic ability</div><h2>Sealed</h2>
      <p class="prose">Some abilities cannot be trained. The GM grants them when something in the story earns them.</p>`;
    return;
  }
  const isAb = !!ABIL[it.id];
  let h = `<button class="linky close-x" data-close="1">Close</button>`;
  h += `<div class="kicker">${isAb ? 'Heroic ability' : it.kind === 'trick' ? 'Magic trick' : cap(it.kind)} · ${esc(SOURCE_LABEL[it.source] || it.source)}${it.page ? ' p. ' + it.page : ''}</div>`;
  h += `<h2>${esc(it.name)}</h2>`;
  if (c && st) {
    const earnedMet = isAb && it.status === 'earned' && st === 'close' && evalReq(it.requirement, c).met;
    const why = earnedMet ? `${c.name} meets the requirement. It is granted in play, not trained.`
      : { owned: `${c.name} has it.`, available: `${c.name} meets the requirement.`, close: isAb ? `${c.name} is within two points.` : `${c.name} is one spell away.`, locked: `${c.name} does not meet it yet.` }[st];
    h += `<div class="verdict s-${st}">${esc(why)}</div>`;
  }
  const dl = [];
  if (isAb) {
    dl.push(['Requires', esc(reqLabel(it.requirement))], ['WP', esc(it.wp || '—')]);
    if (it.status) dl.push(['Status', esc({ granted: 'Granted', 'on-offer': 'On offer, trainable', earned: 'Earned in play only' }[it.status] || it.status)]);
    if (it.grantedTo) dl.push(['Held by', esc(it.grantedTo.join(', '))]);
    if (it.training) dl.push(['Training', `starts at ${it.training.start ?? '?'}, mastered at ${it.training.mastery ?? '?'}`]);
  } else {
    if (it.rank) dl.push(['Rank', it.rank]);
    dl.push(['School', esc(cap(it.school))]);
    for (const [k, l] of [['requirement', 'Casting needs'], ['castingTime', 'Casting time'], ['range', 'Range'], ['duration', 'Duration'], ['ingredients', 'Ingredients'], ['cost', 'Cost']])
      if (it[k]) dl.push([l, esc(it[k])]);
  }
  if (it.slot) dl.push(['Training slot', it.slot === 'undecided' ? '<span class="no">Undecided</span>' : it.slot === 'either' ? 'Either: fills whichever slot is free' : SLOT_LABEL[it.slot]]);
  else if (it.kind === 'trick') dl.push(['Training slot', 'None: tricks are not trained']);
  h += `<dl>${dl.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  // requires
  if (isAb && it.requirement.type !== 'none') {
    const rows = c ? evalReq(it.requirement, c).rows : [];
    if (c && rows.length) h += `<h4>Check for ${esc(c.name)}</h4><ul>${rows.map(r => `<li><span class="${r.ok ? 'ok' : 'no'}">${r.ok ? '✓' : '✗'}</span> ${r.id ? link(r.id) : r.links ? r.links.map(link).join(' or ') : esc(r.label)}${r.have != null ? ` · has ${r.have}${r.best ? ' (' + esc(r.best) + ')' : ''}` : ''}</li>`).join('')}</ul>`;
  }
  if (!isAb && it.prerequisite && it.kind !== 'trick') {
    const p = it.prerequisite; const opts = p.anyOf || p.allOf || [];
    h += `<h4>Needs ${opts.length > 1 ? (p.allOf ? 'all of' : 'one of') : ''}</h4><ul>${opts.map(o => `<li>${c ? `<span class="${optMet(o, c) ? 'ok' : 'no'}">${optMet(o, c) ? '✓' : '✗'}</span> ` : ''}${o.spell ? link(o.spell) : esc(optLabel(o))}</li>`).join('')}</ul>`;
  }
  const un = unlocksOf(it.id);
  if (un.length) h += `<h4>Opens</h4><ul>${un.map(id => `<li>${link(id)}</li>`).join('')}</ul>`;
  if (it.text) h += `<h4>Rules</h4><p class="prose">${esc(it.text)}</p>`;
  else if (it.stub) h += `<p class="empty">The Book of Magic (beta 3) names this ability for forging demonic matter but never prints its rules. Write it as homebrew to put it on the map.</p>`;
  else h += `<p class="empty">Rules text stays in the module's private catalogue and is left out of this prototype.</p>`;
  if (it.details && S.viewer === 'gm') h += `<div class="gmnote"><b>GM notes</b>\n${esc(it.details.replace(/\*\*|`|\*/g, ''))}</div>`;
  el.innerHTML = h;
}

// ---- edges ---------------------------------------------------------------------
function drawEdges(edges) {
  const inner = document.getElementById('inner');
  inner.querySelector('svg.edges')?.remove();
  if (!edges.length) return;
  const box = inner.getBoundingClientRect();
  const at = id => inner.querySelector(`.node[data-id="${CSS.escape(id)}"]`);
  const related = S.sel ? lineage(S.sel, edges) : null;
  const cls = e => !related ? '' : related.has(e.from) && related.has(e.to) ? 'hot' : 'dim';
  let paths = '';
  for (const e of edges) {
    const a = at(e.from), b = at(e.to);
    if (!a || !b) continue;
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const ax = ra.left + ra.width / 2 - box.left, bx = rb.left + rb.width / 2 - box.left;
    let d;
    if (Math.abs(ra.top - rb.top) < 12) {            // same row: arc over the top
      const y = Math.min(ra.top, rb.top) - box.top, lift = 26;
      d = `M${ax},${y} C${ax},${y - lift} ${bx},${y - lift} ${bx},${y}`;
    } else if (rb.top < ra.top) {                     // the usual case: what it opens sits above
      const y1 = ra.top - box.top, y2 = rb.bottom - box.top, my = (y1 + y2) / 2;
      d = `M${ax},${y1} C${ax},${my} ${bx},${my} ${bx},${y2}`;
    } else {
      const y1 = ra.bottom - box.top, y2 = rb.top - box.top, my = (y1 + y2) / 2;
      d = `M${ax},${y1} C${ax},${my} ${bx},${my} ${bx},${y2}`;
    }
    paths += `<path class="${e.dash ? 'dash' : ''} ${cls(e)}" d="${d}"/>`;
  }
  inner.insertAdjacentHTML('afterbegin', `<svg class="edges" width="${inner.scrollWidth}" height="${inner.scrollHeight}" aria-hidden="true">${paths}</svg>`);
}
function lineage(id, edges) {
  const set = new Set([id]);
  let grew = true;
  while (grew) {
    grew = false;
    for (const e of edges) {
      if (set.has(e.to) && !set.has(e.from) && ancestorsOnly(e.to)) { set.add(e.from); grew = true; }
    }
  }
  // descendants
  const down = [id];
  while (down.length) { const x = down.pop(); for (const e of edges) if (e.from === x && !set.has(e.to)) { set.add(e.to); down.push(e.to); } }
  return set;
  function ancestorsOnly() { return true; }
}

// ---- render --------------------------------------------------------------------
let lastPlace = null;
function render() {
  memo.clear();
  const c = ch();
  // tabs
  const tabs = [['abilities', 'Heroic Abilities'], ...SCHOOLS.map(s => [s.id, s.name])];
  document.getElementById('tabs').innerHTML = tabs.map(([id, name], i) => {
    const n = c ? tabItems(id).filter(x => statusOf(x.id, c) === 'available').length : 0;
    return (i === 1 ? '<span class="sep"></span>' : '') + `<button role="tab" id="tab-${id}" aria-selected="${S.tab === id}" data-tab="${id}">${esc(name)}${n ? `<span class="n" title="Can take now">${n}</span>` : ''}</button>`;
  }).join('');
  // toggles
  document.querySelectorAll('[data-viewer]').forEach(b => b.setAttribute('aria-pressed', b.dataset.viewer === S.viewer));
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === S.view));
  document.getElementById('char').value = S.char;
  // chips
  const items = tabItems(S.tab);
  const sources = [...new Set(items.map(i => i.source))];
  document.getElementById('src-chips').innerHTML = sources.length > 1 ? `<span class="lbl">Source</span>` + sources.map(s => `<button class="chip" data-chip="src:${s}" aria-pressed="${!S.off.has('src:' + s)}">${esc(SOURCE_LABEL[s] || s)}</button>`).join('') : '';
  const slotsHere = ['combat', 'non-combat', 'either', 'undecided'].filter(k => items.some(i => i.slot === k));
  document.getElementById('slot-chips').innerHTML = slotsHere.length ? `<span class="lbl">Slot</span>` + slotsHere.map(k => `<button class="chip" data-chip="slot:${k}" aria-pressed="${!S.off.has('slot:' + k)}">${SLOT_LABEL[k]}</button>`).join('') : '';
  document.getElementById('st-chips').innerHTML = c ? `<span class="lbl">Show</span>` + Object.entries(STATUS_LABEL).map(([k, v]) => `<button class="chip" data-chip="st:${k}" aria-pressed="${!S.off.has('st:' + k)}">${v}</button>`).join('') : '';
  // summary
  const sum = document.getElementById('summary');
  if (c) {
    const cnt = { owned: 0, available: 0, close: 0 };
    for (const it of items) { const st = statusOf(it.id, c); if (st in cnt) cnt[st]++; }
    sum.innerHTML = `${esc(c.name.split(' ')[0])}: <b>${cnt.owned}</b> held · <b>${cnt.available}</b> open now · <b>${cnt.close}</b> within reach · of ${items.length}`;
  } else sum.textContent = `${items.length} entries`;
  // stage
  const inner = document.getElementById('inner');
  if (S.view === 'cards') inner.innerHTML = renderCards(S.tab);
  else inner.innerHTML = S.tab === 'abilities' ? renderLadder() : renderTree(S.tab);
  renderDetail();
  const place = S.tab + '/' + S.view;
  requestAnimationFrame(() => {
    if (S.view === 'map' && place !== lastPlace) { const pl = document.getElementById('plate'); pl.scrollTop = pl.scrollHeight; }
    lastPlace = place;
    if (S.view === 'map') {
      const edges = S.tab === 'abilities' ? ladderEdges() : treeEdges(S.tab);
      drawEdges(edges);
      if (S.sel) {
        const rel = lineage(S.sel, edges);
        inner.querySelectorAll('.node').forEach(n => { if (!rel.has(n.dataset.id) && edges.some(e => e.from === S.sel || e.to === S.sel)) n.classList.add('dim'); });
      }
    }
  });
  store.set('tab', S.tab); store.set('view', S.view); store.set('char', S.char); store.set('viewer', S.viewer);
}

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.sel = null; S.off = new Set([...S.off].filter(k => !k.startsWith('src:'))); render(); return; }
  if (t.dataset.viewer) { S.viewer = t.dataset.viewer; render(); return; }
  if (t.dataset.view) { S.view = t.dataset.view; render(); return; }
  if (t.dataset.chip) { const k = t.dataset.chip; S.off.has(k) ? S.off.delete(k) : S.off.add(k); render(); return; }
  if (t.dataset.close) { S.sel = null; render(); return; }
  if (t.dataset.id) {
    const id = t.dataset.id;
    if (t.dataset.jump) {
      const target = MAGIC[id] ? SCHOOLS.find(s => s.name.toUpperCase() === MAGIC[id].school).id : 'abilities';
      S.tab = target;
    }
    S.sel = S.sel === id && !t.dataset.jump ? null : id;
    render();
    if (t.dataset.jump) requestAnimationFrame(() => document.querySelector(`#inner .node[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: 'center', inline: 'center' }));
  }
});
document.getElementById('char').addEventListener('change', e => { S.char = e.target.value; render(); });
document.getElementById('q').addEventListener('input', e => { S.q = e.target.value.trim(); render(); });
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
document.fonts?.ready.then(render);
render();
</script>
