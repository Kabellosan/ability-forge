<title>Ability Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: a working atlas — tabs across the top, the map as a scrolling plate, a reading panel on the right (bottom sheet on phones). */
:root {
  --paper: #eceee7; --panel: #f8f8f4; --ink: #1b2027; --muted: #5d6570; --line: #c7cbc1;
  --accent: #a3301d; --reach: #dfe6da;
  --avail: #1d6b58; --avail-bg: #dcece5; --close: #9a6508; --close-bg: #f3e7cc; --locked: #8a9098;
  --display: "Alegreya SC", "Palatino Linotype", Palatino, Georgia, serif;
  --body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #13161b; --panel: #1b1f26; --ink: #e7e5dc; --muted: #9aa1aa; --line: #2f353e;
  --accent: #e2654c; --reach: #1e2a26;
  --avail: #5cc4a6; --avail-bg: #173229; --close: #e3ab45; --close-bg: #33291a; --locked: #6c737c;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #13161b; --panel: #1b1f26; --ink: #e7e5dc; --muted: #9aa1aa; --line: #2f353e;
  --accent: #e2654c; --reach: #1e2a26;
  --avail: #5cc4a6; --avail-bg: #173229; --close: #e3ab45; --close-bg: #33291a; --locked: #6c737c;
  color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--body); margin: 0; }
.wrap { padding-inline: 16px; padding-block: 14px 24px; max-width: 1500px; margin: 0 auto; display: grid; gap: 12px; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; justify-content: space-between; }
.brand h1 { font: 700 1.9rem/1 var(--display); margin: 0; letter-spacing: .02em; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 11px; cursor: pointer; font-size: .88rem; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
label.pick { display: inline-flex; gap: 6px; align-items: center; font-size: .88rem; color: var(--muted); }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }

nav.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
nav.tabs button { border: 0; background: none; padding: 8px 12px 7px; cursor: pointer; white-space: nowrap;
  font: 500 .98rem var(--display); color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .n { font: 700 .72rem var(--body); background: var(--avail-bg); color: var(--avail); border-radius: 9px; padding: 0 6px; font-variant-numeric: tabular-nums; }
nav.tabs .sep { width: 1px; background: var(--line); margin: 8px 6px; flex: none; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.toolbar input[type=search] { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; width: 200px; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chips .lbl { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 2px 10px; font-size: .84rem; cursor: pointer; }
.chip[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.summary { color: var(--muted); font-size: .9rem; margin-left: auto; font-variant-numeric: tabular-nums; }
.summary b { color: var(--ink); font-weight: 700; }

main.body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.stage { min-width: 0; }
.plate { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); max-height: calc(100vh - 210px); min-height: 320px; }
.plate-inner { position: relative; }
svg.edges { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
svg.edges path { fill: none; stroke: var(--line); stroke-width: 1.6; }
svg.edges path.dash { stroke-dasharray: 5 4; }
svg.edges path.hot { stroke: var(--accent); stroke-width: 2.2; }
svg.edges path.dim { opacity: .25; }

/* nodes */
.node { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel);
  border-radius: 5px; padding: 3px 8px; font-size: .86rem; cursor: pointer; text-align: left; line-height: 1.25; position: relative; z-index: 1; max-width: 100%; }
.node .meta { color: var(--muted); font-size: .74rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.node .src { font: 700 .62rem var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.node.s-owned { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.node.s-owned .meta { color: var(--paper); opacity: .75; }
.node.s-owned .src { color: var(--paper); }
.node.s-available { border-color: var(--avail); background: var(--avail-bg); }
.node.s-close { border: 1px dashed var(--close); background: var(--close-bg); }
.node.s-locked { color: var(--locked); }
.node.sealed { border-style: dotted; color: var(--muted); font-style: italic; }
.node.stub { border-style: dotted; }
.node.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.node.dim { opacity: .28; }
.node.faded { opacity: .35; }

/* sky: one constellation at a time, read bottom-up (Skyrim's skill menu).
   The sky is night in both themes on purpose. */
:root { --sky-bg1: #070b18; --sky-bg2: #18223f; --sky-line: rgba(168, 188, 240, .30); --sky-text: #d3dbf0; --sky-dim: #6a7592;
  --star-owned: #fff0b3; --star-avail: #a6e0ff; --star-close: #e8c56c; --star-locked: #49536f; --star-plain: #dfe6ff; --sky-hot: #ff9b7a; }
.sky { position: relative; background: radial-gradient(ellipse at 50% 110%, var(--sky-bg2), var(--sky-bg1) 70%); color: var(--sky-text); min-width: 560px; }
.sky svg { display: block; width: 100%; height: auto; }
.sky .bgstar { fill: #fff; }
.sky .edge { fill: none; stroke: var(--sky-line); stroke-width: 1.3; }
.sky .edge.root { stroke-dasharray: 2 5; }
.sky .edge.dash { stroke-dasharray: 6 5; }
.sky .edge.lit { stroke: var(--star-owned); opacity: .75; }
.sky .edge.hot { stroke: var(--sky-hot); stroke-width: 2; opacity: 1; }
.sky .edge.dim { opacity: .12; }
.star { cursor: pointer; outline: none; }
.star text { fill: var(--sky-text); font: 500 12px var(--body); text-anchor: middle; paint-order: stroke; stroke: var(--sky-bg1); stroke-width: 3px; }
.star .core, .star .halo { fill: var(--star-plain); }
.star .halo { opacity: .22; }
.star.s-owned .core, .star.s-owned .halo { fill: var(--star-owned); }
.star.s-owned .halo { opacity: .45; }
.star.s-owned text { fill: var(--star-owned); font-weight: 700; }
.star.s-available .core, .star.s-available .halo { fill: var(--star-avail); }
.star.s-close .core { fill: var(--sky-bg1); stroke: var(--star-close); stroke-width: 1.6; }
.star.s-close .halo { fill: var(--star-close); opacity: .12; }
.star.s-locked .core { fill: var(--star-locked); }
.star.s-locked .halo { opacity: 0; }
.star.s-locked text { fill: var(--sky-dim); }
.star.sealed text { font-style: italic; fill: var(--sky-dim); }
.star .ring { fill: none; stroke: var(--sky-hot); stroke-width: 1.8; opacity: 0; }
.star.sel .ring, .star:focus-visible .ring { opacity: 1; }
.star.faded { opacity: .22; }
.star.dim { opacity: .3; }
.root text { fill: var(--sky-dim); font: 700 11px var(--body); letter-spacing: .08em; text-transform: uppercase; text-anchor: middle; }
.root text tspan.v { fill: var(--sky-text); letter-spacing: 0; }
.root path { fill: none; stroke: var(--sky-dim); stroke-width: 1.4; }
.sky-cap { position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 10px; padding: 8px 12px 12px;
  background: linear-gradient(to top, var(--sky-bg1) 55%, transparent); }
.sky-cap .nm { text-align: center; }
.sky-cap h2 { margin: 0; font: 700 1.9rem/1 var(--display); letter-spacing: .06em; color: #f1f3fb; text-wrap: balance; }
.sky-cap p { margin: 4px 0 0; font-size: .88rem; color: var(--sky-text); font-variant-numeric: tabular-nums; }
.sky-cap button { background: none; border: 0; color: var(--sky-dim); cursor: pointer; font: 500 .95rem var(--display); padding: 6px 4px; }
.sky-cap button:hover { color: var(--sky-text); }
.sky-cap .prev { justify-self: start; } .sky-cap .next { justify-self: end; }
@media (prefers-reduced-motion: no-preference) {
  .sky svg.turn-l { animation: turnL .28s ease-out; } .sky svg.turn-r { animation: turnR .28s ease-out; }
  @keyframes turnL { from { opacity: 0; transform: translateX(-36px); } }
  @keyframes turnR { from { opacity: 0; transform: translateX(36px); } }
}

/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; padding: 12px; }
.card { display: grid; gap: 4px; align-content: start; padding: 10px 12px; border-radius: 6px; cursor: pointer; text-align: left; }
.card.node { display: grid; }
.card .nm { font: 700 1.02rem var(--display); }
.card .req { font-size: .84rem; }
.card .foot { display: flex; justify-content: space-between; gap: 8px; }

/* detail */
aside.detail { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; position: sticky; top: 12px; max-height: calc(100vh - 40px); overflow: auto; display: grid; gap: 10px; }
aside.detail h2 { font: 700 1.4rem/1.1 var(--display); margin: 0; text-wrap: balance; }
aside.detail .kicker { font: 700 .7rem var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
aside.detail dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: .9rem; }
aside.detail dt { color: var(--muted); }
aside.detail dd { margin: 0; }
aside.detail h4 { margin: 4px 0 2px; font: 700 .74rem var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
aside.detail ul { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 3px; }
.ok { color: var(--avail); font-weight: 700; }
.no { color: var(--accent); font-weight: 700; }
.linky { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; cursor: pointer; }
.prose { font-size: .93rem; max-width: 62ch; }
.gmnote { font-size: .84rem; color: var(--muted); white-space: pre-wrap; border-top: 1px dashed var(--line); padding-top: 8px; }
.verdict { padding: 6px 10px; border-radius: 5px; font-size: .9rem; }
.verdict.s-owned { background: var(--ink); color: var(--paper); }
.verdict.s-available { background: var(--avail-bg); color: var(--avail); }
.verdict.s-close { background: var(--close-bg); color: var(--close); }
.verdict.s-locked { background: var(--paper); color: var(--muted); }
.empty { color: var(--muted); font-size: .92rem; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; font-size: .8rem; }
.close-x { display: none; }

@media (max-width: 900px) {
  main.body { grid-template-columns: minmax(0, 1fr); }
  .plate { max-height: none; }
  aside.detail { position: fixed; left: 0; right: 0; bottom: 0; top: auto; max-height: 62vh; border-radius: 12px 12px 0 0; z-index: 20;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 24px rgb(0 0 0 / .18); }
  .close-x { display: inline-block; justify-self: end; }
  .summary { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) { .node { transition: opacity .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Ability <span>Forge</span></h1>
      <p>View prototype · Core Rulebook, Book of Magic (beta 3), Veritapola homebrew</p>
    </div>
    <div class="controls">
      <label class="pick" for="char">Character
        <select id="char">
          <option value="">Nobody</option>
        </select>
      </label>
      <div class="seg" role="group" aria-label="Viewer">
        <button id="viewer-gm" data-viewer="gm">GM</button><button id="viewer-player" data-viewer="player">Player</button>
      </div>
      <div class="seg" role="group" aria-label="View">
        <button id="view-map" data-view="map">Sky</button><button id="view-cards" data-view="cards">Cards</button>
      </div>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search by name" aria-label="Search by name">
    <div class="chips" id="src-chips"></div>
    <div class="chips" id="slot-chips"></div>
    <div class="chips" id="st-chips"></div>
    <div class="summary" id="summary"></div>
  </div>
  <main class="body">
    <div class="stage"><div class="plate" id="plate"><div class="plate-inner" id="inner"></div></div></div>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </main>
</div>

<script type="application/json" id="atlas-data">/*DATA*/</script>
<script>
const D = JSON.parse(document.getElementById('atlas-data').textContent);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- rules data --------------------------------------------------------------
const ATTR = { Acrobatics:'AGL', Awareness:'INT', Bartering:'CHA', 'Beast Lore':'INT', Bluffing:'CHA', Bushcraft:'INT',
  Crafting:'STR', Evade:'AGL', Healing:'INT', 'Hunting & Fishing':'AGL', Languages:'INT', 'Myths & Legends':'INT',
  Performance:'CHA', Persuasion:'CHA', Riding:'AGL', Seamanship:'INT', 'Sleight of Hand':'AGL', Sneaking:'AGL',
  'Spot Hidden':'INT', Swimming:'AGL', Axes:'STR', Bows:'AGL', Brawling:'STR', Crossbows:'AGL', Hammers:'STR',
  Knives:'AGL', Slings:'AGL', Spears:'STR', Staves:'AGL', Swords:'STR' };
const WEAPONS = ['Axes','Bows','Brawling','Crossbows','Hammers','Knives','Slings','Spears','Staves','Swords'];
const MAGIC_SKILLS = ['Animism','Demonology','Elementalism','Illusionism','Mentalism','Necromancy','Symbolism','Witchcraft','Alchemy','Enchanting','Dracomancy'];
const ALIAS = { Swim: 'Swimming' };
const baseChance = a => a <= 5 ? 3 : a <= 8 ? 4 : a <= 12 ? 5 : a <= 15 ? 6 : 7;
const SOURCE_LABEL = { core: 'Core', 'book-of-magic': 'Book of Magic', homebrew: 'Veritapola', svendsen: 'Svendsen pack' };
const SLOT_LABEL = { combat: 'Combat', 'non-combat': 'Non-combat', either: 'Either', untrainable: 'Not trainable', undecided: 'Undecided' };
const STATUS_LABEL = { owned: 'Has it', available: 'Can take now', close: 'Within reach', locked: 'Locked' };

// Example characters come from private/characters.json (never committed).
const CHARS = D.characters || {};

const ABIL = Object.fromEntries(D.abilities.map(a => [a.id, a]));
const MAGIC = Object.fromEntries(D.magic.map(m => [m.id, m]));
const SCHOOLS = D.schools;

// ---- evaluation ----------------------------------------------------------------
function sv(ch, skill) {
  skill = ALIAS[skill] || skill;
  if (skill in ch.skills) return ch.skills[skill];
  if (MAGIC_SKILLS.includes(skill)) return 0;
  return ATTR[skill] ? baseChance(ch.attrs[ATTR[skill]]) : 0;
}
function reqLabel(r) {
  if (!r) return '';
  if (r.type === 'none') return 'No requirement';
  if (r.type === 'allOf') return r.of.map(reqLabel).join(' + ');
  if (r.type === 'mastered') return (ABIL[r.ability]?.name || r.ability) + ' mastered';
  if (r.type === 'has') return r.of.map(o => (ABIL[o.ability] || MAGIC[o.spell])?.name || o.ability || o.spell).join(' or ');
  if (r.group) return ({ melee:'Any melee weapon', weapon:'Any weapon skill', 'str-melee':'Any STR melee weapon', magic:'Any magic school' })[r.group] + ' ' + r.level;
  if (r.skills) return r.skills.join(' / ') + ' ' + r.level;
  return r.raw || 'Not printed';
}
function evalReq(r, ch) {
  if (r.type === 'none') return { met: true, gap: 0, rows: [] };
  if (r.type === 'mastered') {
    const ok = ch.abilities.includes(r.ability);
    return { met: ok, gap: ok ? 0 : 99, rows: [{ label: reqLabel(r), ok, id: r.ability }] };
  }
  if (r.type === 'has') {
    const ok = r.of.some(o => o.ability ? ch.abilities.includes(o.ability) : ch.spells.includes(o.spell));
    return { met: ok, gap: ok ? 0 : 99, rows: [{ label: reqLabel(r), ok, links: r.of.map(o => o.ability || o.spell) }] };
  }
  if (r.type === 'allOf') {
    const parts = r.of.map(p => evalReq(p, ch));
    return { met: parts.every(p => p.met), gap: parts.reduce((s, p) => s + p.gap, 0), rows: parts.flatMap(p => p.rows) };
  }
  if (r.skills) {
    let best = r.skills[0], bv = -1;
    for (const s of r.skills) { const v = sv(ch, s); if (v > bv) { bv = v; best = s; } }
    const gap = Math.max(0, r.level - bv);
    return { met: gap === 0, gap, rows: [{ label: reqLabel(r), ok: gap === 0, have: bv, best: r.skills.length > 1 ? best : null }] };
  }
  return { met: false, gap: 99, rows: [{ label: reqLabel(r), ok: false }] };
}
const memo = new Map();
function statusOf(id, ch) {
  if (!ch) return null;
  const key = id;
  if (memo.has(key)) return memo.get(key);
  memo.set(key, 'locked');                       // guards cycles
  let s;
  if (ABIL[id]) {
    const a = ABIL[id];
    if (ch.abilities.includes(id)) s = 'owned';
    else if (a.stub) s = 'locked';
    else {
      const r = evalReq(a.requirement, ch);
      s = r.met ? 'available' : (r.gap <= 2 ? 'close' : 'locked');
      if (a.status === 'earned' && s === 'available') s = 'close';   // cannot be trained, only granted
    }
  } else {
    const m = MAGIC[id];
    if (ch.spells.includes(id)) s = 'owned';
    else if (m.kind === 'trick') s = hasSchool(ch, slug(m.school)) ? 'available' : 'locked';
    else if (prereqMet(m.prerequisite, ch)) s = 'available';
    else {
      const opts = m.prerequisite.anyOf || m.prerequisite.allOf || [];
      const unmet = opts.filter(o => !optMet(o, ch));
      const reachable = o => o.spell && statusOf(o.spell, ch) === 'available';
      const oneStep = unmet.length > 0 && (m.prerequisite.anyOf ? unmet.some(reachable) : unmet.every(reachable));
      s = oneStep ? 'close' : 'locked';
    }
  }
  memo.set(key, s);
  return s;
}
function anySchool(ch) { return MAGIC_SKILLS.some(s => (ch.skills[s] || 0) > 0); }
function hasSchool(ch, sid) {
  if (sid === 'general-magic') return anySchool(ch);
  if (sid === 'harmonism') return sv(ch, 'Performance') >= 12;
  const skill = MAGIC_SKILLS.find(s => slug(s) === sid);
  return (ch.skills[skill] || 0) > 0;
}
function optMet(o, ch) {
  if (o.anySchool) return anySchool(ch);
  if (o.spell) return ch.spells.includes(o.spell);
  if (o.anyRank) return ch.spells.some(id => MAGIC[id] && MAGIC[id].kind !== 'trick' && MAGIC[id].rank === o.anyRank && (!o.school || MAGIC[id].school === o.school));
  if (o.school) return hasSchool(ch, slug(o.school));
  if (o.skill) return sv(ch, o.skill) >= o.level;
  return false;
}
function prereqMet(p, ch) {
  if (p.anyOf) return p.anyOf.some(o => optMet(o, ch));
  if (p.allOf) return p.allOf.every(o => optMet(o, ch));
  return false;
}
function optLabel(o) {
  if (o.anySchool) return 'Any school of magic';
  if (o.spell) return MAGIC[o.spell]?.name || o.spell;
  if (o.anyRank) return `Any rank ${o.anyRank}${o.school ? ' ' + cap(o.school) : ''} spell`;
  if (o.school) return cap(o.school);
  if (o.skill) return `${o.skill} ${o.level}`;
  return o.text || '?';
}
const cap = s => s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());

// ---- state ---------------------------------------------------------------------
const store = { get(k, d) { try { const v = localStorage.getItem('atlas.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem('atlas.' + k, JSON.stringify(v)); } catch {} } };
const S = { allSchools: false, tab: store.get('tab', 'g-weapons'), view: store.get('view', 'map'), char: store.get('char', Object.keys(D.characters || {})[0] || ''),
  viewer: store.get('viewer', 'gm'), q: '', off: new Set(), sel: null };
if (location.hash.length > 1) S.tab = location.hash.slice(1);   // render() falls back to the first visible constellation
const ch = () => CHARS[S.char] || null;
document.getElementById('char').insertAdjacentHTML('beforeend', Object.entries(CHARS).map(([k, c]) => `<option value="${k}">${esc(c.name)}</option>`).join(''));

// ---- constellations ------------------------------------------------------------

// ---- sky layout ------------------------------------------------------------------
const TIER = 100, BASE = 92, TOP = 56, GAP = 108;
function spread(list, W) {

  list.sort((a, b) => a.want - b.want);
  const n = list.length, left = 60, right = W - 60;
  if (n === 1) { list[0].x = Math.min(right, Math.max(left, list[0].want)); list[0].dy = 0; return; }
  if ((n - 1) * GAP <= right - left) {

    for (let i = n - 1; i >= 0; i--) list[i].x = Math.min(list[i].x, i < n - 1 ? list[i + 1].x - GAP : right);

function layoutSky(tab, W) {

    const lanes = new Map();
    for (const a of items) {
      const l = a.id === 'magic-talent' ? { key: 'Magic Talent', skills: null } : laneOf(a);
      if (!lanes.has(l.key)) lanes.set(l.key, { key: l.key, skills: l.skills, items: [] });
      lanes.get(l.key).items.push(a);

    const H = TOP + BASE + levels.length * TIER + 40;

    spread(spots, W);

      r.l.x = r.x; r.l.y = rootY + r.dy;

    }

      const tier = items.filter(a => laneOf(a).level === lv).map(a => ({ a, want: laneFor(a).x }));
      spread(tier, W);

// ---- lineage -------------------------------------------------------------------
function lineage(id, edges) {
  const set = new Set([id]);
  const up = [id];
  while (up.length) { const x = up.pop(); for (const e of edges) if (e.to === x && !set.has(e.from)) { set.add(e.from); up.push(e.from); } }
  const down = [id];
  while (down.length) { const x = down.pop(); for (const e of edges) if (e.from === x && !set.has(e.to)) { set.add(e.to); down.push(e.to); } }
  return set;
}

  const items = tabItems(S.tab);
  const sources = [...new Set(items.map(i => i.source))];
  document.getElementById('src-chips').innerHTML = (sources.length > 1 ? `<span class="lbl">Source</span>` + sources.map(s => `<button class="chip" data-chip="src:${s}" aria-pressed="${!S.off.has('src:' + s)}">${esc(SOURCE_LABEL[s] || s)}</button>`).join('') : '')
    + (c && S.viewer === 'gm' ? ` <button class="chip" data-allschools="1" aria-pressed="${!!S.allSchools}" title="GM only: show magic this character cannot use">All magic</button>` : '');
  const slotsHere = ['combat', 'non-combat', 'either', 'untrainable', 'undecided'].filter(k => items.some(i => i.slot === k));
  document.getElementById('slot-chips').innerHTML = slotsHere.length ? `<span class="lbl">Slot</span>` + slotsHere.map(k => `<button class="chip" data-chip="slot:${k}" aria-pressed="${!S.off.has('slot:' + k)}">${SLOT_LABEL[k]}</button>`).join('') : '';
  document.getElementById('st-chips').innerHTML = c ? `<span class="lbl">Show</span>` + Object.entries(STATUS_LABEL).map(([k, v]) => `<button class="chip" data-chip="st:${k}" aria-pressed="${!S.off.has('st:' + k)}">${v}</button>`).join('') : '';
  document.getElementById('summary').textContent = '';
  const inner = document.getElementById('inner'), plate = document.getElementById('plate');
  if (S.view === 'cards') inner.innerHTML = renderCards(S.tab);
  else inner.innerHTML = renderSky(S.tab, Math.max(560, plate.clientWidth - 2), turnDir);
  turnDir = null;
  renderDetail();
  const place = S.tab + '/' + S.view;
  if (S.view === 'map' && place !== lastPlace) requestAnimationFrame(() => { plate.scrollTop = plate.scrollHeight; });
  lastPlace = place;
  store.set('tab', S.tab); store.set('view', S.view); store.set('char', S.char); store.set('viewer', S.viewer);
}
function turn(step) {
  const list = constellations(), i = list.findIndex(k => k.id === S.tab);
  S.tab = list[(i + step + list.length) % list.length].id; S.sel = null; turnDir = step < 0 ? 'l' : 'r'; render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, .star');
  if (!t) return;
  if (t.dataset.tab) { turnDir = t.dataset.dir || null; S.tab = t.dataset.tab; S.sel = null; S.off = new Set([...S.off].filter(k => !k.startsWith('src:'))); render(); return; }
  if (t.dataset.viewer) { S.viewer = t.dataset.viewer; render(); return; }
  if (t.dataset.view) { S.view = t.dataset.view; render(); return; }
  if (t.dataset.allschools) { S.allSchools = !S.allSchools; render(); return; }
  if (t.dataset.chip) { const k = t.dataset.chip; S.off.has(k) ? S.off.delete(k) : S.off.add(k); render(); return; }
  if (t.dataset.close) { S.sel = null; render(); return; }
  if (t.dataset.id) {
    const id = t.dataset.id;
    if (t.dataset.jump && constellations().some(k => k.id === tabOf(id))) S.tab = tabOf(id);
    S.sel = S.sel === id && !t.dataset.jump ? null : id;
    render();
  }
});
document.addEventListener('keydown', e => {
  if (e.target.matches?.('input, select, textarea')) return;
  if (e.key === 'ArrowLeft' && S.view === 'map') { e.preventDefault(); turn(-1); }
  if (e.key === 'ArrowRight' && S.view === 'map') { e.preventDefault(); turn(1); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('star')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.getElementById('char').addEventListener('change', e => { S.char = e.target.value; render(); });
document.getElementById('q').addEventListener('input', e => { S.q = e.target.value.trim(); render(); });
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
document.fonts?.ready.then(render);
render();
</script>
